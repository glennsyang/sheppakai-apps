name: Database Backup

on:
  workflow_dispatch: # Allow manual triggers
    inputs:
      app:
        description: App whose database to back up
        required: true
        type: choice
        options:
          - synapse
          - mealplanner
          - budget

permissions:
  contents: read
  issues: write

jobs:
  backup:
    name: Backup SQLite Database (${{ inputs.app }})
    runs-on: ubuntu-latest
    # FLY_API_TOKEN and BACKUP_ENCRYPTION_PASSPHRASE come from the app's environment.
    environment: ${{ inputs.app }}

    steps:
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Resolve Fly app and database path
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            synapse) echo "FLY_APP=synapse-dev" >> "$GITHUB_ENV"; echo "DB_PATH=/data/synapse.db" >> "$GITHUB_ENV" ;;
            mealplanner) echo "FLY_APP=sheppakai-mealplanner" >> "$GITHUB_ENV"; echo "DB_PATH=/data/db.sqlite" >> "$GITHUB_ENV" ;;
            budget) echo "FLY_APP=sheppakai-budget" >> "$GITHUB_ENV"; echo "DB_PATH=/data/sheppakaibudget.db" >> "$GITHUB_ENV" ;;
            *) echo "Unknown app: $APP" >&2; exit 1 ;;
          esac

      - name: Get timestamp
        id: timestamp
        run: echo "date=$(date -u +'%Y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Dump database from Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Creating database backup..."
          flyctl ssh console -a "$FLY_APP" -C "sqlite3 $DB_PATH .dump" > backup-${{ steps.timestamp.outputs.date }}.sql

      - name: Compress backup
        run: |
          echo "Compressing backup..."
          gzip -9 backup-${{ steps.timestamp.outputs.date }}.sql

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          # The dump contains password hashes and live session tokens (plus all app
          # data), so it must never land in the (unencrypted, 30-day-retained) Actions
          # artifact store as plaintext. Fail closed if the secret isn't configured,
          # rather than silently uploading an unencrypted backup.
          if [ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            echo "Error: BACKUP_ENCRYPTION_PASSPHRASE secret is not set. Refusing to upload an unencrypted database dump." >&2
            echo "Generate one (e.g. 'openssl rand -base64 32') and add it as a repo secret named BACKUP_ENCRYPTION_PASSPHRASE." >&2
            exit 1
          fi

          echo "Encrypting backup..."
          BACKUP_FILE="backup-${{ steps.timestamp.outputs.date }}.sql.gz"
          # Feed the passphrase on stdin (fd 0) rather than as an argument, so it never
          # appears in the runner's process list. printf is a shell builtin, so it
          # doesn't spawn a process with the passphrase in argv either.
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "$BACKUP_FILE.gpg" "$BACKUP_FILE"

          # Remove the plaintext archive so only the encrypted copy remains on disk.
          rm "$BACKUP_FILE"

          echo "To decrypt: printf '%s' \"\$BACKUP_ENCRYPTION_PASSPHRASE\" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output backup.sql.gz $BACKUP_FILE.gpg"

      - name: Validate backup
        run: |
          BACKUP_FILE="backup-${{ steps.timestamp.outputs.date }}.sql.gz.gpg"

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "Error: Backup file is empty or does not exist"
            exit 1
          fi

          BACKUP_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
          echo "✓ Backup validation passed"
          echo "Backup size: $BACKUP_SIZE"
          echo "backup_size=$BACKUP_SIZE" >> $GITHUB_OUTPUT

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-backup-${{ inputs.app }}-${{ steps.timestamp.outputs.date }}
          path: backup-${{ steps.timestamp.outputs.date }}.sql.gz.gpg
          retention-days: 30
          compression-level: 9

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP: ${{ inputs.app }}
        with:
          script: |
            const title = `[Automated] Database Backup Failure (${process.env.APP})`;

            // Check for existing open issues with same title
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure',
            });

            const duplicateIssue = existingIssues.data.find(issue => issue.title === title);

            if (!duplicateIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `## Database Backup Failure Report
                
                **Workflow**: Database Backup
                **Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
                
                **Details**:
                - Branch: \`${context.ref}\`
                - Commit: ${context.sha}
                - Actor: @${context.actor}
                - Timestamp: ${new Date().toISOString()}
                
                The automated database backup failed. Please review the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.
                
                **Next Steps**:
                1. Review the logs to identify the cause
                2. Fix any issues with Fly.io connectivity or database access
                3. Run the backup manually using workflow_dispatch if needed
                4. This issue will auto-close when the next backup succeeds`,
                labels: ['backup-failure', 'automated', 'bug'],
                assignees: [context.actor]
              });
              console.log('Created issue for backup failure');
            } else {
              console.log('Duplicate issue already exists, skipping creation');
            }

      - name: Close backup failure issues on success
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP: ${{ inputs.app }}
        with:
          script: |
            const title = `[Automated] Database Backup Failure (${process.env.APP})`;

            // Find all open issues with backup-failure label
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure',
            });

            // Close each one
            for (const issue of issues.data) {
              if (issue.title !== title) continue;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✓ Database backup succeeded on ${new Date().toISOString()}\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nAuto-closing this issue.`
              });
              
              console.log(`Closed issue #${issue.number}: ${issue.title}`);
            }

            if (issues.data.length === 0) {
              console.log('No open backup-failure issues to close');
            }
