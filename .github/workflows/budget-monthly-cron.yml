name: Budget Reset Recurring Job

on:
  schedule:
    - cron: '10 8 1 * *' # 1st of every month at 12:10 AM PST / 1:10 AM PDT
  workflow_dispatch: # Allow manual trigger

permissions: {}

jobs:
  trigger-reset:
    uses: ./.github/workflows/cron-trigger.yml
    secrets: inherit
    with:
      environment: budget
      path: /api/cron/reset-recurring-paid
