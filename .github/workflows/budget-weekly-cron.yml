name: Budget Weekly Summary Email

on:
  schedule:
    - cron: '10 16 * * 1' # Monday 8:10am PST / 9:10am PDT
  workflow_dispatch: # Allow manual trigger

permissions: {}

jobs:
  trigger-emails:
    uses: ./.github/workflows/cron-trigger.yml
    secrets: inherit
    with:
      environment: budget
      path: /api/cron/email-weekly-summary
      jq-check: '.result.emailsFailed == 0'
