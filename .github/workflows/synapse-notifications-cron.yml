name: Synapse Scheduled Notifications

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allow manual trigger

permissions: {}

jobs:
  trigger-emails:
    uses: ./.github/workflows/cron-trigger.yml
    with:
      environment: synapse
      path: /api/cron/email-notifications
