name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A change to a shared package, the lockfile or root tooling re-checks every app.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'config/**'
              - 'lefthook.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/pr-check.yml'
            apps/synapse:
              - *shared
              - 'apps/synapse/**'
            apps/mealplanner:
              - *shared
              - 'apps/mealplanner/**'
            apps/budget:
              - *shared
              - 'apps/budget/**'
            packages/logger:
              - *shared
            packages/shared:
              - *shared

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'

      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level high

  checks:
    name: Format, Lint, Test (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
        exclude:
          - project: shared

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Run Ox format check
        run: pnpm run fmt:check

      - name: Run Ox lint
        run: pnpm run lint:github

      - name: Run type check
        run: pnpm run check

      - name: Run tests
        run: pnpm run test:ci

      - name: Report Coverage
        if: always() && startsWith(matrix.project, 'apps/')
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: ${{ matrix.project }}
          working-directory: ${{ matrix.project }}
          json-summary-path: './coverage/coverage-summary.json'
          json-final-path: './coverage/coverage-final.json'
