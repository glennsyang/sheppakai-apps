# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Each app's FLY_API_TOKEN lives in a GitHub environment named after the app, so a job only
# ever sees its own app's deploy token.

name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        required: true
        type: choice
        options:
          - synapse
          - mealplanner
          - budget

permissions:
  contents: read

jobs:
  changes:
    name: Select apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.app) || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'scripts/start.sh'
              - 'scripts/migrate.js'
            synapse:
              - *shared
              - 'apps/synapse/**'
            mealplanner:
              - *shared
              - 'apps/mealplanner/**'
            budget:
              - *shared
              - 'apps/budget/**'

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.app }}
    concurrency: deploy-${{ matrix.app }}

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        exclude:
          - app: shared

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        working-directory: .
        run: pnpm audit --prod --audit-level high

      - name: Setup environment for type checking
        run: cp .env.example .env

      - name: Run Ox lint
        run: pnpm run lint

      - name: Run Svelte check
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      # Deploy only if all checks pass
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # Build context is the repo root so the image can see the workspace lockfile and packages/.
      # One root Dockerfile serves every app; APP picks the apps/<folder> to build.
      - name: Deploy to Fly.io
        working-directory: .
        run: >
          flyctl deploy . --remote-only
          --config "apps/$APP/fly.toml"
          --dockerfile Dockerfile
          --build-arg APP="$APP"
          --build-secret SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN"
        env:
          APP: ${{ matrix.app }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
