# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Each app's FLY_API_TOKEN lives in a GitHub environment named after the app, so a job only
# ever sees its own app's deploy token.

name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        required: true
        type: choice
        options:
          - synapse
          - mealplanner
          - budget

permissions:
  contents: read

jobs:
  changes:
    name: Select apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      projects: ${{ steps.apps.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: .github/filters.yml

      # Keep only the apps/<app> keys: `apps` names the Fly apps, `projects` their paths.
      - name: Resolve apps
        id: apps
        env:
          CHANGES: ${{ github.event_name == 'workflow_dispatch' && format('["apps/{0}"]', inputs.app) || steps.filter.outputs.changes }}
        run: |
          projects=$(jq -c '[.[] | select(startswith("apps/"))]' <<< "$CHANGES")
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "apps=$(jq -c 'map(ltrimstr("apps/"))' <<< "$projects")" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    uses: ./.github/workflows/checks.yml
    with:
      projects: ${{ needs.changes.outputs.projects }}

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: [changes, checks]
    runs-on: ubuntu-latest
    environment: ${{ matrix.app }}
    concurrency: deploy-${{ matrix.app }}

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # Build context is the repo root so the image can see the workspace lockfile and packages/.
      # One root Dockerfile serves every app; APP picks the apps/<folder> to build.
      - name: Deploy to Fly.io
        run: >
          flyctl deploy . --remote-only
          --config "apps/$APP/fly.toml"
          --dockerfile Dockerfile
          --build-arg APP="$APP"
          --build-arg NODE_VERSION="$(cat .node-version)"
          --build-secret SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN"
        env:
          APP: ${{ matrix.app }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
