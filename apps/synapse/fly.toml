app = 'synapse-dev'
primary_region = 'yyz'

[build]

[env]
  # Fly's proxy terminates TCP, so the socket address is the proxy's, not the
  # client's. Make getClientAddress() (used by the auth rate limiter) read the
  # real client IP from the header Fly sets on every proxied request.
  ADDRESS_HEADER = 'Fly-Client-IP'
  # adapter-node rejects request bodies over 512K by default. Meal estimates upload photos up to
  # MAX_AI_IMAGE_BYTES (5 MB, @sheppakai/shared/ai-vision) plus multipart overhead.
  BODY_SIZE_LIMIT = '6M'

[[mounts]]
  source = 'data'
  destination = '/data'
  
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  
  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/api/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
