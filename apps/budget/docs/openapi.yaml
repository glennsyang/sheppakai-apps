        - name: "month"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 12
        - name: "year"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 2000
            maximum: 2100
        - name: "limit"
          in: "query"
          required: false
          schema:
            default: 50
            type: "integer"
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Income"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
