openapi: "3.1.0"
info:
  title: "Sheppakai Budget API"
  version: "1"
  description: "Read and write access to the budget app for external tools. Every request needs an API key, created by an admin under Admin → API Keys, with the scope each operation names.\n\nScopes: `transactions:read`, `transactions:write`, `budgets:read`, `categories:read`, `dashboard:read`, `income:read`, `income:write`, `recurring:read`, `recurring:markPaid`, `windowCleaningCustomers:read`, `windowCleaningCustomers:write`, `windowCleaningJobs:read`, `windowCleaningJobs:write`, `contributions:write`.\n\nEvery response is JSON: `{ \"data\": ... }` on success, `{ \"error\": { \"code\", \"message\" } }` on failure. Every write is recorded in an audit log with the key that made it."
servers:
  - url: "https://budget.example.com"
    description: "Replace with the deployed app URL."
security:
  - apiKey: []
paths:
  "/api/v1/expenses":
    get:
      operationId: "getExpenses"
      summary: "List expenses"
      description: "Newest first. `startDate` and `endDate` must be given together. `limit` only applies when no date range is given.\n\nRequires the `transactions:read` scope."
      x-required-scope: "transactions:read"
      parameters:
        - name: "startDate"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: "endDate"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: "categoryId"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
        - name: "limit"
          in: "query"
          required: false
          schema:
            default: 50
            type: "integer"
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Expense"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: "postExpenses"
      summary: "Create an expense"
      description: "Requires the `transactions:write` scope."
      x-required-scope: "transactions:write"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                amount:
                  type: "number"
                  exclusiveMinimum: 0
                payee:
                  type: "string"
                  minLength: 1
                  maxLength: 100
                notes:
                  type: "string"
                  minLength: 1
                  maxLength: 800
                date:
                  type: "string"
                  minLength: 1
                  pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                gstAmount:
                  type: "number"
                excludedFromBudget:
                  default: false
                  type: "boolean"
                categoryId:
                  type: "string"
                  minLength: 1
              required:
                - "amount"
                - "payee"
                - "notes"
                - "date"
                - "categoryId"
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/Expense"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/budgets":
    get:
      operationId: "getBudgets"
      summary: "List category budgets for a year, or one month of it"
      description: "Requires the `budgets:read` scope."
      x-required-scope: "budgets:read"
      parameters:
        - name: "month"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 12
        - name: "year"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Budget"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/categories":
    get:
      operationId: "getCategories"
      summary: "List categories"
      description: "Requires the `categories:read` scope."
      x-required-scope: "categories:read"
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Category"
                required:
                  - "data"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/dashboard":
    get:
      operationId: "getDashboard"
      summary: "Dashboard summary"
      description: "The same figures the dashboard page shows. `mode=monthly` (default) uses `month` and `year`; `mode=yearly` uses `year` and `view`. Defaults to the current month or year.\n\nRequires the `dashboard:read` scope."
      x-required-scope: "dashboard:read"
      parameters:
        - name: "mode"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "monthly"
              - "yearly"
        - name: "month"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 12
        - name: "year"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 2000
            maximum: 2100
        - name: "view"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "current"
              - "full"
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardSummary"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/income":
    get:
      operationId: "getIncome"
      summary: "List income"
      description: "`startDate` and `endDate` must be given together; `month` needs `year`. `limit` only applies when no range is given.\n\nRequires the `income:read` scope."
      x-required-scope: "income:read"
