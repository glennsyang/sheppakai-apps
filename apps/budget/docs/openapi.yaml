        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: "postIncome"
      summary: "Record income"
      description: "Requires the `income:write` scope."
      x-required-scope: "income:write"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  minLength: 1
                  maxLength: 100
                description:
                  type: "string"
                  minLength: 1
                  maxLength: 500
                date:
                  type: "string"
                  minLength: 1
                  pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                amount:
                  type: "number"
                  exclusiveMinimum: 0
              required:
                - "name"
                - "description"
                - "date"
                - "amount"
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/Income"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/recurring-bills":
    get:
      operationId: "getRecurringBills"
      summary: "List active recurring bills"
      description: "`paid` is this period's paid state: the current month, or the current year for Yearly bills.\n\nRequires the `recurring:read` scope."
      x-required-scope: "recurring:read"
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/RecurringBill"
                required:
                  - "data"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/recurring-bills/{id}":
    patch:
      operationId: "patchRecurringBillsById"
      summary: "Mark a recurring bill paid or unpaid for the current period"
      description: "Requires the `recurring:markPaid` scope."
      x-required-scope: "recurring:markPaid"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Recurring bill id."
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                paid:
                  type: "boolean"
              required:
                - "paid"
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/RecurringBill"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "No record with that id (`not_found`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/window-cleaning/customers":
    get:
      operationId: "getWindowCleaningCustomers"
      summary: "List window-cleaning customers"
      description: "Requires the `windowCleaningCustomers:read` scope."
      x-required-scope: "windowCleaningCustomers:read"
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/WindowCleaningCustomer"
                required:
                  - "data"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: "postWindowCleaningCustomers"
      summary: "Create a window-cleaning customer"
      description: "Requires the `windowCleaningCustomers:write` scope."
      x-required-scope: "windowCleaningCustomers:write"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  minLength: 1
                  maxLength: 100
                address:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                city:
                  type: "string"
                  minLength: 1
                  maxLength: 100
                unitNumber:
                  type: "string"
                  maxLength: 20
                buzzerNumber:
                  type: "string"
                  maxLength: 20
                phoneNumber:
                  type: "string"
                  maxLength: 20
                email:
                  anyOf:
                    - type: "string"
                      maxLength: 255
                      format: "email"
                      pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                    - type: "string"
                      const: ""
                notes:
                  type: "string"
                  maxLength: 500
                recleanIntervalDays:
                  type: "integer"
                  minimum: 1
                  maximum: 730
              required:
                - "name"
                - "address"
                - "city"
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/WindowCleaningCustomer"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/window-cleaning/customers/{id}":
    patch:
      operationId: "patchWindowCleaningCustomersById"
      summary: "Replace a window-cleaning customer"
      description: "A full replace of the editable fields, not a partial patch.\n\nRequires the `windowCleaningCustomers:write` scope."
      x-required-scope: "windowCleaningCustomers:write"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Customer id."
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  minLength: 1
                  maxLength: 100
                address:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                city:
                  type: "string"
                  minLength: 1
                  maxLength: 100
                unitNumber:
                  type: "string"
                  maxLength: 20
                buzzerNumber:
                  type: "string"
                  maxLength: 20
                phoneNumber:
                  type: "string"
                  maxLength: 20
                email:
                  anyOf:
                    - type: "string"
                      maxLength: 255
                      format: "email"
                      pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                    - type: "string"
                      const: ""
                notes:
                  type: "string"
                  maxLength: 500
                recleanIntervalDays:
                  type: "integer"
                  minimum: 1
                  maximum: 730
              required:
                - "name"
                - "address"
                - "city"
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/WindowCleaningCustomer"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "No record with that id (`not_found`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/window-cleaning/jobs":
    get:
      operationId: "getWindowCleaningJobs"
      summary: "List window-cleaning jobs"
      description: "Filter by `customerId`, or by `year` (with an optional `month`).\n\nRequires the `windowCleaningJobs:read` scope."
      x-required-scope: "windowCleaningJobs:read"
      parameters:
        - name: "customerId"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
        - name: "month"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 12
        - name: "year"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: "OK."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/WindowCleaningJob"
                required:
                  - "data"
        "400":
          description: "Invalid JSON, or a query or body that failed validation (`invalid_json`, `validation_failed`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, malformed or invalid API key, or a key without the required scope."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this API key (`rate_limited`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Server error (`internal_error`)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: "postWindowCleaningJobs"
      summary: "Record a window-cleaning job"
      description: "Requires the `windowCleaningJobs:write` scope."
      x-required-scope: "windowCleaningJobs:write"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                customerId:
                  type: "string"
                  minLength: 1
                jobDate:
                  type: "string"
                  minLength: 1
                  pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                jobTime:
